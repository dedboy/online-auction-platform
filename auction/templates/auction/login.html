{% extends "auction/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card mt-5">
            <div class="card-body">
                <h3 class="card-title text-center">Tizimga kirish</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Kirish</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
