<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Auktsion Platformasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Auction App</a>
            <div class="text-white">
                {% if user.is_authenticated %}
                    Salom, {{ user.username }}! | <a href="/admin/logout/" class="btn btn-outline-danger btn-sm">Chiqish</a>
                {% else %}
                    <a href="/admin/login/" class="btn btn-outline-primary btn-sm">Kirish</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
