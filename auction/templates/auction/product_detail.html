{% extends "auction/base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.title }}">
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1>{{ product.title }}</h1>
        <p class="text-muted">Tavsif: {{ product.description }}</p>
        <hr>
        <h3>Joriy narx: <span class="text-success">{{ product.start_price }} so'm</span></h3>
        
        <div class="card mt-4">
            <div class="card-body">
                <h5>Garov tikish</h5>
                <form method="POST">
                    {% csrf_token %}
                    <div class="input-group mb-3">
                        <input type="number" name="bid_amount" class="form-control" placeholder="Miqdorni kiriting" required>
                        <button class="btn btn-warning" type="submit">Tikish</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
